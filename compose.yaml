# One stack (ARCHITECTURE §8.2). Data lives in named volumes only. ClickHouse, Redis and Nitro are published on
# NODE_BIND (loopback by default; 0.0.0.0 for an API box on the LAN, which ops/firewall.sh then admits alone).
name: rhnode
# CPU under contention (cpu_shares, relative; 1024 = Docker's default): 1. the node keeping up with the chain (nitro,
# l1proxy, ingest), 2. serving (clickhouse, redis, projector; ClickHouse splits its own share by workload, migration
# 031), 3. everything else (promoter). They only bite when the CPU is full. Applied live with `docker update --cpu-shares`.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    restart: unless-stopped
    cpu_shares: 2048
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-rhnode}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-rhnode}
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/merges.xml:/etc/clickhouse-server/config.d/merges.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["${NODE_BIND:-127.0.0.1}:8123:8123"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    cpu_shares: 2048
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports: ["${NODE_BIND:-127.0.0.1}:6379:6379"] # the API box reads the block stream (ops/firewall.sh admits only it)

  ingest:
    build: .
    restart: unless-stopped
    cpu_shares: 4096 # tier 1: the tip (and its traces, lost if late)
    command: ["node", "src/ingest/main.ts"]
    env_file: .env
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NITRO_HTTP: http://nitro:8547 # TRACES=tip traces our own node only (src/ingest/traces.ts)
    depends_on:
      clickhouse: { condition: service_healthy }

  projector:
    build: .
    restart: unless-stopped
    cpu_shares: 2048
    command: ["node", "src/projector/main.ts"]
    env_file: .env
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      clickhouse: { condition: service_healthy }

  # Fetches the history of tokens older than go-live, once, when the API first has to refuse one (src/promoter).
  promoter:
    build: .
    restart: unless-stopped
    cpu_shares: 256 # tier 3: the history pass, promotion, discovery
    command: ["node", "src/promoter/main.ts"]
    env_file: .env
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      NITRO_HTTP: http://nitro:8547 # the history walk (WALK=1) reads our own node only
    depends_on:
      clickhouse: { condition: service_healthy }

  # Our own Robinhood Chain full node (`docker compose --profile node up -d`). Flags verified against
  # nitro-node v3.12.2 `--help` (2026-10-29); seed it with nitro/snapshot.sh first (otherwise it syncs from genesis
  # for weeks). Memory: capped so the box's other services win (oom_score_adj kills Nitro first). Sized for a 16 GB
  # box shared with ClickHouse; raise NITRO_MEM and the caches on a bigger one. HTTP/WS on NODE_BIND, for the API box.
  # Nitro's L1 reads go through this (src/l1proxy.ts): keyed L1 URLs stay out of Nitro's logs, and providers fail over.
  l1proxy:
    profiles: ["node"]
    build: .
    restart: unless-stopped
    cpu_shares: 4096
    command: ["node", "src/l1proxy.ts"]
    environment:
      L1_HTTP: ${L1_HTTP:-https://eth.drpc.org|20} # url|rps,… first one up wins; dRPC is keyless and serves old logs (2026-10-30)

  nitro:
    profiles: ["node"]
    image: offchainlabs/nitro-node:v3.12.2-5f02f3f
    restart: unless-stopped
    cpu_shares: 4096 # tier 1: following the chain
    stop_grace_period: 5m
    depends_on: [l1proxy]
    mem_limit: ${NITRO_MEM:-8g}
    memswap_limit: ${NITRO_MEM:-8g}
    oom_score_adj: 500
    ports: ["${NODE_BIND:-127.0.0.1}:8547:8547", "${NODE_BIND:-127.0.0.1}:8548:8548"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      GOMEMLIMIT: ${NITRO_GOMEMLIMIT:-5000MiB} # container limit − Pebble/fastcache (off-heap) − margin
      MALLOC_ARENA_MAX: "2"
      GOGC: ${NITRO_GOGC:-100} # the live heap is small (~0.5 GB, pprof 2026-10-30): at 100 it collects every ~1.3 s
    volumes:
      - nitro:/home/user/.arbitrum # the image runs as uid 1000 `user` (not /home/nitro as older docs say)
      - ./nitro:/home/user/config:ro
    command:
      - --chain.info-files=/home/user/config/robinhood-chain-info.json
      - --init.genesis-json-file=/home/user/config/robinhood-genesis.json
      - --persistent.chain=/home/user/.arbitrum/robinhood
      - --parent-chain.connection.url=http://l1proxy:8545 # PublicNode's keyless RPC refuses logs older than ~128 blocks
      - --parent-chain.blob-client.beacon-url=${L1_BEACON:-https://ethereum-beacon-api.publicnode.com}
      - --node.feed.input.url=wss://feed.mainnet.chain.robinhood.com,wss://delayed-feed.mainnet.chain.robinhood.com
      - --execution.forwarding-target=https://rpc.mainnet.chain.robinhood.com
      - --node.staker.enable=false
      - --execution.caching.state-scheme=path # must match the snapshot (full-path)
      - --execution.caching.database-cache=${NITRO_DB_CACHE:-768}
      - --execution.caching.trie-clean-cache=${NITRO_TRIE_CACHE:-384}
      - --execution.caching.snapshot-cache=${NITRO_SNAPSHOT_CACHE:-384}
      # The log index costs ~0.5 core while catching up (pprof 2026-10-30). The default covers ~11 days, which ClickHouse
      # already holds. --execution.rpc.log-no-history turns it off; --execution.rpc.log-history=0 indexes the whole chain.
      - ${NITRO_LOG_INDEX:---execution.rpc.log-history=9400000}
      - --execution.caching.trie-dirty-cache=256
      # The block prefetcher (default on) runs the next block speculatively. Off on the 18 W node box: same 94–95 Mgas/s
      # with 180% instead of 289% CPU (A/B/A, 30 min phases, 2026-10-30).
      - --execution.enable-prefetch-block=${NITRO_PREFETCH:-true}
      - --execution.caching.stylus-lru-cache-capacity=256 # the default
      # Recent state kept in memory: debug_trace* and eth_call work only this many blocks back on a path-scheme full node
      # (128 ≈ 13 s at ~104 ms blocks; 1200 ≈ 2 min, for tracing at the tip).
      - --execution.caching.pathdb-max-diff-layers=${NITRO_DIFF_LAYERS:-128}
      - --persistent.pebble.max-concurrent-compactions=3
      - --node.resource-mgmt.mem-free-limit=768M # refuse heavy RPC instead of OOM
      - --http.addr=0.0.0.0
      - --http.port=8547
      - --http.vhosts=*
      - --http.api=net,web3,eth,arb,debug
      - --ws.addr=0.0.0.0
      - --ws.port=8548
      - --ws.api=net,web3,eth
      - --metrics
      - --metrics-server.addr=0.0.0.0
      - --pprof # :6071 on the compose network only (go tool pprof http://nitro:6071/debug/pprof/profile)
      - --pprof-cfg.addr=0.0.0.0

volumes:
  clickhouse:
  nitro:
